# SERVO for Blast Gate
# Aug 2026
#
# Board: DOIT ESP32 DEVKIT V1 (DOIT)
# Definition: definitions/boards/esp32doit-devkit-v1/manifest.yaml
substitutions: # Define names here once
  device_name: bg-bench # Blast Gate - Table Saw, do not use '_' but '-' in name due to DNS
  pin_led:         GPIO2  # D4 onboard LED
  pin_servo_pwm:   GPIO4  # D2
  pin_servo_power: GPIO16 # D0 pull down
  pin_button1:     GPIO12 # D6 
# ESP32S WROOM
#  pin_led:         GPIO2  # onboard LED
#  pin_servo_pwm:   GPIO4  #
#  pin_servo_power: GPIO22 # 
#  pin_button1:     GPIO23 #
  
esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  on_boot:
    priority: 600
    then:
      - script.execute: keep_alive_script

esp8266:
  board: d1_mini

#esp32:
#  variant: esp32
#  board: nodemcu-32s
  # board: esp32dev
#  flash_size: 4MB
#  framework:
#    type: esp-idf

logger:

api:
  encryption:
    key: "enter your secret key"
  services:
    - service: control_servo
      variables:
        level: float
      then:
        - servo.write:
            id: my_servo
            level: !lambda 'return level / 100.0;'
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name} Fallback Hotspot
    password: "e86dnfZhsWIy"

captive_portal:
  id: Servo2_Wifi

mqtt:
  broker: 192.168.xxx.yyy
  # Sent automatically by the device when it connects successfully
  birth_message:
    topic: "${device_name}/status"
    payload: "online"
    qos: 1
    retain: true

  # Sent automatically by the broker if the device disconnects unexpectedly
  will_message:
    topic: "${device_name}/status"
    payload: "offline"
    qos: 1
    retain: true
    
script:
  - id: keep_alive_script
    mode: restart
    then:
      - delay: 5min
      - mqtt.publish:
          topic: "${device_name}/status"
          payload: "online"
      - script.execute: keep_alive_script
  
globals:
  - id: target_angle
    type: float
    restore_value: yes
    initial_value: '360.0' # Startposition (z.B. 360 Grad = Offen)
    
output:
#  - platform: ledc
  - platform: esp8266_pwm
    id: servo_output
    pin: ${pin_servo_pwm}
    frequency: 50Hz

servo:
  - id: my_servo
    output: servo_output
    min_level: 3%
    max_level: 12.5%

sensor:
  - platform: template
    id: servo_actual_position
    name: "Servo Current Angle"
    unit_of_measurement: "°"
    lambda: !lambda 'return id(target_angle);'
    update_interval: never
    
binary_sensor:
  - platform: gpio
    pin: ${pin_button1}
    name: "Physical Button"
    on_press:
      then:
        - switch.toggle: valve_switch
        - mqtt.publish:
            topic: ${device_name}/btn_open
            payload: !lambda |-
              return (id(target_angle) > 180) ? "true" : "false";
          
switch:
  - platform: gpio
    name: "Relay"
    # pin: ${pin_servo_power}
    pin:
      number: ${pin_servo_power}
#      mode:
#        output: true
#        pulldown: true
#        input: false
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF
    
  - platform: gpio
    name: "OnboardLED"
    pin: ${pin_led}
    inverted: true # only WEMOS D1 Mini
    id: onboard_led
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Valve Control"
    id: valve_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # device_class: gate
    # Der Zustand richtet sich nach dem aktuellen Winkel
    # false = geschlossen; true = geöffnet
    lambda: !lambda |-
      if (id(target_angle) == 360.0) {
        return false; 
      } else {
        return true;
      }
    # Logik für das Schließen (Fahrt auf 360 Grad)
    turn_on_action:
      then:
        - switch.turn_on: relay
        - delay: 0.8s
        - switch.turn_on: onboard_led
        - globals.set:
            id: target_angle
            value: '180.0'
        - servo.write:
            id: my_servo
            level: 0.0
        - delay: 0.8s
        - component.update: servo_actual_position
        - switch.template.publish:
            id: valve_switch
            state: true
        - switch.turn_off: relay
        - switch.turn_off: onboard_led
    # Logik für das Öffnen (Fahrt auf 180 Grad)
    turn_off_action:
      then:
        - switch.turn_on: relay
        - delay: 0.8s
        - switch.turn_on: onboard_led
        - globals.set:
            id: target_angl
